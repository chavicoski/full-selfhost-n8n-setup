# Production Override Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d

services:
  postgres:
    # Don't expose postgres port in production
    ports: []
    volumes:
      # Use host-bound volumes for production data persistence
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data

  ollama:
    volumes:
      # Use host-bound volume for production
      - ${OLLAMA_DATA_PATH:-./data/ollama}:/root/.ollama

  n8n:
    environment:
      NODE_ENV: production
      N8N_LOG_LEVEL: warn
      N8N_METRICS: true
    volumes:
      # Use host-bound volumes for production data
      - ${N8N_DATA_PATH:-./data/n8n}:/home/node/.n8n
    # Don't expose n8n port directly in production (use Traefik)
    ports: []
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.localhost}`)"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  traefik:
    profiles:
      - production
    labels:
      # Traefik dashboard configuration
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN:-traefik.localhost}`)"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.entrypoints=websecure"