# Production Override Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d

services:
  postgres:
    # Don't expose postgres port in production
    ports: []
    environment:
      # Production logging
      POSTGRES_LOG_STATEMENT: ${POSTGRES_PROD_LOG_STATEMENT:-none}
      POSTGRES_LOG_MIN_DURATION_STATEMENT: ${POSTGRES_PROD_LOG_MIN_DURATION:-1000}
    volumes:
      # Use named volumes for production data
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_PROD_MEMORY_LIMIT:-2G}
          cpus: '${POSTGRES_PROD_CPU_LIMIT:-2}'
        reservations:
          memory: ${POSTGRES_PROD_MEMORY_RESERVATION:-512M}
          cpus: '${POSTGRES_PROD_CPU_RESERVATION:-1}'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - ${POSTGRES_TMP_PATH:-/tmp}
      - ${POSTGRES_RUN_PATH:-/var/run/postgresql}

  ollama:
    volumes:
      # Use named volume for production
      - ollama_data_prod:/root/.ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_PROD_MEMORY_LIMIT:-16G}
          cpus: '${OLLAMA_PROD_CPU_LIMIT:-4}'
        reservations:
          memory: ${OLLAMA_PROD_MEMORY_RESERVATION:-4G}
          cpus: '${OLLAMA_PROD_CPU_RESERVATION:-2}'
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Enable GPU profile for production
    profiles:
      - gpu
      - production

  n8n:
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      N8N_LOG_LEVEL: ${N8N_PROD_LOG_LEVEL:-warn}
      N8N_METRICS: ${N8N_PROD_METRICS:-true}
      # Production security
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_DISABLE_UI: ${N8N_DISABLE_PRODUCTION_UI:-false}
    volumes:
      # Use named volumes for production data
      - n8n_data_prod:/home/node/.n8n
      - ${N8N_CUSTOM_NODES_PATH:-./custom-nodes}:/home/node/.n8n/custom:ro
      - ${N8N_BACKUPS_PATH:-./backups}:/home/node/backups:rw
      - ${N8N_LOGS_PATH:-./logs}:/home/node/.n8n/logs:rw
    # Don't expose n8n port directly in production (use Traefik)
    ports: []
    deploy:
      resources:
        limits:
          memory: ${N8N_PROD_MEMORY_LIMIT:-4G}
          cpus: '${N8N_PROD_CPU_LIMIT:-2}'
        reservations:
          memory: ${N8N_PROD_MEMORY_RESERVATION:-1G}
          cpus: '${N8N_PROD_CPU_RESERVATION:-1}'
      restart_policy:
        condition: ${N8N_RESTART_CONDITION:-on-failure}
        delay: ${N8N_RESTART_DELAY:-10s}
        max_attempts: ${N8N_RESTART_MAX_ATTEMPTS:-3}
        window: ${N8N_RESTART_WINDOW:-120s}
    # Enhanced security for production
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.${DOMAIN:-localhost}}`)"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.services.n8n.loadbalancer.server.port=${N8N_INTERNAL_PORT:-5678}"
      # Security headers
      - "traefik.http.middlewares.n8n-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.n8n-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.n8n-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.n8n-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.n8n.middlewares=n8n-headers"

  traefik:
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-512M}
          cpus: '${TRAEFIK_CPU_LIMIT:-0.5}'
    security_opt:
      - no-new-privileges:true
    labels:
      # Traefik dashboard configuration
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$2y$$10$$example}"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN:-traefik.${DOMAIN:-localhost}}`)"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.entrypoints=websecure"

volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}

  ollama_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OLLAMA_DATA_PATH:-./data/ollama}

  n8n_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${N8N_DATA_PATH:-./data/n8n}