services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}
          cpus: '${POSTGRES_CPU_LIMIT:-1}'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:-n8n}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:${POSTGRES_INTERNAL_PORT:-5432}"
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-n8n}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-5}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-30s}

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_ollama
    restart: unless-stopped
    environment:
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS:-*}
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0}
      OLLAMA_PORT: ${OLLAMA_INTERNAL_PORT:-11434}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_EXTERNAL_PORT:-11434}:${OLLAMA_INTERNAL_PORT:-11434}"
    networks:
      - n8n-network
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OLLAMA_INTERNAL_PORT:-11434}/api/version"]
      interval: ${OLLAMA_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${OLLAMA_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${OLLAMA_HEALTHCHECK_RETRIES:-3}
      start_period: ${OLLAMA_HEALTHCHECK_START_PERIOD:-60s}

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${N8N_MEMORY_LIMIT:-2G}
          cpus: '${N8N_CPU_LIMIT:-1}'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${N8N_DB_SCHEMA:-public}

      # n8n Configuration
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_INTERNAL_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:${N8N_EXTERNAL_PORT:-5678}}

      # Security
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET}

      # Features
      N8N_METRICS: ${N8N_METRICS:-false}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: ${N8N_LOG_OUTPUT:-console}

      # AI/LLM Configuration for Ollama integration
      N8N_AI_ENABLED: ${N8N_AI_ENABLED:-true}

      # Execution Configuration
      EXECUTIONS_PROCESS: ${N8N_EXECUTIONS_PROCESS:-main}
      EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE:-regular}
      EXECUTIONS_TIMEOUT: ${N8N_EXECUTIONS_TIMEOUT:-3600}
      EXECUTIONS_TIMEOUT_MAX: ${N8N_EXECUTIONS_TIMEOUT_MAX:-3600}

      # Generic OAuth
      N8N_HIDE_USAGE_PAGE: ${N8N_HIDE_USAGE_PAGE:-true}

      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}

    volumes:
      - n8n_data:/home/node/.n8n
      - ${N8N_CUSTOM_NODES_PATH:-./custom-nodes}:/home/node/.n8n/custom
      - ${N8N_BACKUPS_PATH:-./backups}:/home/node/backups
      - ${N8N_LOGS_PATH:-./logs}:/home/node/.n8n/logs
    ports:
      - "${N8N_EXTERNAL_PORT:-5678}:${N8N_INTERNAL_PORT:-5678}"
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${N8N_INTERNAL_PORT:-5678}/healthz"]
      interval: ${N8N_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${N8N_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${N8N_HEALTHCHECK_RETRIES:-3}
      start_period: ${N8N_HEALTHCHECK_START_PERIOD:-60s}
    user: "${N8N_USER_ID:-1000}:${N8N_GROUP_ID:-1000}"

  # Optional: Traefik reverse proxy for production deployments
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v2.10}
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_traefik
    restart: unless-stopped
    profiles:
      - production
    command:
      - "--api.dashboard=true"
      - "--api.insecure=${TRAEFIK_API_INSECURE:-false}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik_letsencrypt:${TRAEFIK_CERTS_PATH:-/letsencrypt}
    networks:
      - n8n-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN:-traefik.${DOMAIN:-localhost}}`)"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  n8n_data:
    driver: local
  traefik_letsencrypt:
    driver: local

networks:
  n8n-network:
    name: ${NETWORK_NAME:-n8n-network}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}