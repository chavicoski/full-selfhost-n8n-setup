# Development Override Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  n8n:
    environment:
      N8N_LOG_LEVEL: debug
      N8N_METRICS: true
      NODE_ENV: development

  # Development database admin tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_LOGIN_BANNER: '"N8N Development Environment"'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - n8n-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:
    driver: local