# Development Override Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:${POSTGRES_INTERNAL_PORT:-5432}"
    environment:
      POSTGRES_LOG_STATEMENT: ${POSTGRES_DEV_LOG_STATEMENT:-all}
      POSTGRES_LOG_MIN_DURATION_STATEMENT: ${POSTGRES_DEV_LOG_MIN_DURATION:-0}
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_DEV_MEMORY_LIMIT:-512M}
          cpus: '${POSTGRES_DEV_CPU_LIMIT:-0.5}'

  ollama:
    # Remove GPU requirement for development
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_DEV_MEMORY_LIMIT:-4G}
          cpus: '${OLLAMA_DEV_CPU_LIMIT:-2}'
    # Remove GPU profile requirement
    profiles: []

  n8n:
    environment:
      N8N_LOG_LEVEL: ${N8N_DEV_LOG_LEVEL:-debug}
      N8N_METRICS: ${N8N_DEV_METRICS:-true}
      NODE_ENV: ${NODE_ENV:-development}
      # Enable hot reload for custom nodes in development
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
    volumes:
      # Mount local custom nodes for development
      - ${N8N_CUSTOM_NODES_PATH:-./custom-nodes}:/home/node/.n8n/custom:rw
      # Mount logs for easier debugging
      - ${N8N_LOGS_PATH:-./logs}:/home/node/.n8n/logs:rw
    deploy:
      resources:
        limits:
          memory: ${N8N_DEV_MEMORY_LIMIT:-1G}
          cpus: '${N8N_DEV_CPU_LIMIT:-1}'
    # Remove security restrictions for development
    security_opt: []
    cap_drop: []
    cap_add: []

  # Development database admin tool
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-n8n}_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@n8n.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: '${PGADMIN_SERVER_MODE:-False}'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: '${PGADMIN_COOKIE_PROTECTION:-False}'
      PGADMIN_CONFIG_LOGIN_BANNER: '${PGADMIN_LOGIN_BANNER:-N8N Development Environment}'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - n8n-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${PGADMIN_MEMORY_LIMIT:-256M}
          cpus: '${PGADMIN_CPU_LIMIT:-0.5}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: ${PGADMIN_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${PGADMIN_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${PGADMIN_HEALTHCHECK_RETRIES:-3}
      start_period: ${PGADMIN_HEALTHCHECK_START_PERIOD:-60s}

volumes:
  pgadmin_data:
    driver: local